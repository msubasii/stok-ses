<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StokSes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F0E7D5; min-height: 100vh; }
    .header { background: #4B3935; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 16px; font-weight: 500; color: #F0E7D5; display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 28px; height: 28px; background: #F0E7D5; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 16px; height: 16px; stroke: #4B3935; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .badge { background: #6b524e; color: #F0E7D5; font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 500; }
    .main { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; border: 0.5px solid #d4c9bc; border-radius: 12px; padding: 16px; }
    .card-title { font-size: 13px; font-weight: 500; color: #4B3935; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .mic-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; }
    .mic-btn { width: 72px; height: 72px; border-radius: 50%; background: #4B3935; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
    .mic-btn.recording { background: #8B2020; }
    .mic-btn svg { width: 28px; height: 28px; stroke: #F0E7D5; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mic-label { font-size: 13px; color: #7a6560; }
    .transcript-box { background: #F0E7D5; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #4B3935; line-height: 1.5; min-height: 60px; }
    .send-btn { width: 100%; padding: 9px; background: #4B3935; color: #F0E7D5; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 10px; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { background: #F0E7D5; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 500; color: #4B3935; }
    .stat-num.danger { color: #8B2020; }
    .stat-label { font-size: 11px; color: #7a6560; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { text-align: left; padding: 6px 8px; color: #7a6560; font-weight: 500; border-bottom: 0.5px solid #d4c9bc; }
    td { padding: 7px 8px; border-bottom: 0.5px solid #d4c9bc; color: #4B3935; }
    tr:last-child td { border-bottom: none; }
    .pill { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 500; }
    .pill-ok { background: #e8f5e9; color: #2e6b35; }
    .pill-warn { background: #fdecea; color: #8B2020; }
    .full { grid-column: 1 / -1; }
    .msg-box { background: #F0E7D5; border-radius: 8px; padding: 12px; font-size: 12px; color: #4B3935; line-height: 1.6; white-space: pre-wrap; min-height: 80px; }
    .copy-btn { margin-top: 10px; padding: 7px 14px; border: 0.5px solid #d4c9bc; border-radius: 8px; background: transparent; font-size: 12px; color: #7a6560; cursor: pointer; }
    .empty { color: #7a6560; font-size: 13px; text-align: center; padding: 20px 0; }
    @media (max-width: 600px) { .main { grid-template-columns: 1fr; } .full { grid-column: 1; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </div>
      StokSes
    </div>
    <span class="badge">Kooperatif Asistanı</span>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4B3935" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Sesli stok girişi
      </div>
      <div class="mic-area">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <span class="mic-label" id="micLabel">Mikrofona bas ve konuş</span>
      </div>
      <div class="transcript-box" id="transcript">Konuşman burada görünecek...</div>
      <button class="send-btn" id="sendBtn" onclick="stokIsle()" disabled>Stoka İşle</button>
    </div>

    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4B3935" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Stok durumu
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statToplam">0</div><div class="stat-label">Toplam ürün</div></div>
        <div class="stat"><div class="stat-num danger" id="statKritik">0</div><div class="stat-label">Kritik</div></div>
        <div class="stat"><div class="stat-num" id="statYeterli">0</div><div class="stat-label">Yeterli</div></div>
      </div>
      <table>
        <tr><th>Ürün</th><th>Miktar</th><th>Durum</th></tr>
        <tbody id="stokTablosu">
          <tr><td colspan="3" class="empty">Henüz stok girişi yapılmadı</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card full">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4B3935" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Tedarikçi mesajı
      </div>
      <div class="msg-box" id="tedarikciMesaji">Stok girişi yaptıktan sonra otomatik oluşturulacak...</div>
      <button class="copy-btn" onclick="kopyala()">Kopyala</button>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000';
    let recognition = null;
    let recording = false;

    function toggleMic() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Tarayıcınız ses tanımayı desteklemiyor. Chrome kullanın.');
        return;
      }
      if (recording) {
        recognition.stop();
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        recording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('micLabel').textContent = 'Dinleniyor... (tekrar bas durdurmak için)';
        document.getElementById('transcript').textContent = '';
      };

      recognition.onresult = (e) => {
        let text = '';
        for (let i = 0; i < e.results.length; i++) {
          text += e.results[i][0].transcript;
        }
        document.getElementById('transcript').textContent = text;
        document.getElementById('sendBtn').disabled = false;
      };

      recognition.onend = () => {
        recording = false;
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('micLabel').textContent = 'Mikrofona bas ve konuş';
      };

      recognition.start();
    }

    async function stokIsle() {
      const metin = document.getElementById('transcript').textContent;
      if (!metin || metin === 'Konuşman burada görünecek...') return;

      document.getElementById('sendBtn').disabled = true;
      document.getElementById('sendBtn').textContent = 'İşleniyor...';

      try {
        const res = await fetch(`${API}/stok/isle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ metin })
        });
        const data = await res.json();
        tabloGuncelle(data.stok);
        tedarikciMesajiGetir();
      } catch (e) {
        alert('Bağlantı hatası. Backend çalışıyor mu?');
      } finally {
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = 'Stoka İşle';
      }
    }

    function tabloGuncelle(stok) {
      const tbody = document.getElementById('stokTablosu');
      const urunler = Object.values(stok);
      if (urunler.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">Henüz stok girişi yapılmadı</td></tr>';
        return;
      }
      let kritik = 0, yeterli = 0;
      tbody.innerHTML = urunler.map(u => {
        const isKritik = u.miktar <= 5;
        if (isKritik) kritik++; else yeterli++;
        return `<tr>
          <td>${u.urun_adi}</td>
          <td>${u.miktar} ${u.birim}</td>
          <td><span class="pill ${isKritik ? 'pill-warn' : 'pill-ok'}">${isKritik ? 'Kritik' : 'Yeterli'}</span></td>
        </tr>`;
      }).join('');
      document.getElementById('statToplam').textContent = urunler.length;
      document.getElementById('statKritik').textContent = kritik;
      document.getElementById('statYeterli').textContent = yeterli;
    }

    async function tedarikciMesajiGetir() {
      const res = await fetch(`${API}/stok/tedarikci-mesaji`);
      const data = await res.json();
      document.getElementById('tedarikciMesaji').textContent = data.mesaj;
    }

    async function stokYukle() {
      try {
        const res = await fetch(`${API}/stok`);
        const data = await res.json();
        tabloGuncelle(data.stok);
        tedarikciMesajiGetir();
      } catch (e) {}
    }

    function kopyala() {
      const mesaj = document.getElementById('tedarikciMesaji').textContent;
      navigator.clipboard.writeText(mesaj).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Kopyalandı!';
        setTimeout(() => btn.textContent = 'Kopyala', 2000);
      });
    }

    stokYukle();
  </script>
</body>
</html>
